    <style>
      body { margin: 0; }
      .preload-shell { box-sizing: border-box; display: grid; min-height: 100vh; min-height: 100dvh; place-content: center; justify-items: center; gap: 24px; padding: 24px; background: var(--color-background, #f7f7ef); color: var(--color-forest, #43191f); font-family: "Nunito", system-ui, sans-serif; text-align: center; }
      .preload-mark { display: block; width: 112px; height: 112px; }
      .preload-track { stroke: var(--color-sage, #f3c4ae); stroke-width: 1.5; }
      .preload-orbit { stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
      .preload-orbit { transform-origin: 56px 56px; animation: preload-orbit 1.6s linear infinite; }
      @keyframes preload-orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .preload-orbit { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preload-shell bg-background" role="status" aria-label="Loading" aria-live="polite" aria-atomic="true">
        <svg class="preload-mark" viewBox="0 0 112 112" width="112" height="112" fill="none" aria-hidden="true" focusable="false">
          <circle class="preload-track" cx="56" cy="56" r="50" />
          <image href="/logo.png" x="28" y="22" width="56" height="68" preserveAspectRatio="xMidYMid meet" />
          <path class="preload-orbit" d="M56 6a50 50 0 0 1 50 50" />
        </svg>
      </div>
    </div>
    <noscript>
      <style>#root { display: none; }</style>
      <p class="preload-shell">Blazemap explains forest and land fire awareness in Kalimantan. Enable JavaScript to view the information page. Stay away from smoke and flames; in immediate danger, move to safety and contact local emergency services.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
